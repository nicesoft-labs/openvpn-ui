AppName = openvpn-ui
HttpPort = 8080
RunMode = dev
EnableGzip = true
EnableAdmin = true
SessionOn = true
CopyRequestBody = true
DbPath = "./db/data.db"
AuthType = "password"
; LdapAddress = "localhost:389"
; LdapDn = "cn=%s,ou=users,dc=syncloud,dc=org"
; plain/tls/starttls
; LdapTransport = "plain"
; LdapInsecureSkipVerify = true
;EasyRsaPath = "/usr/share/easy-rsa"
EasyRsaPath = "./easy-rsa"
OpenVpnPath = "./openvpn"
OpenVpnManagementAddress = "openvpn:2080"
OpenVpnManagementNetwork = "tcp"
metrics.enabled = true
metrics.db_path = /var/lib/nicevpn/metrics.db
metrics.poll_interval = 30s
metrics.mi_network = tcp
metrics.mi_address = 127.0.0.1:2080
metrics.log_enrichment_enabled = true
metrics.openvpn_log_path = /var/log/openvpn/openvpn.log
